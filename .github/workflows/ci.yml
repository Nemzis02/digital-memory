name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migration drift
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/core/db/schema.ts changed without a migration. Run npm run db:generate and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://digital_memory:ci@127.0.0.1:5432/digital_memory
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ci-only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digital_memory
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: digital_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digital_memory -d digital_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        env:
          QDRANT__SERVICE__API_KEY: ci-only
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The Qdrant image carries no shell tool for a container health command.
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "$QDRANT_URL/readyz" && exit 0
            sleep 2
          done
          echo "::error::Qdrant did not become ready"
          exit 1

      - name: Integration tests
        run: npm run test:integration

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6.2.1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
